name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: |
          dart format lib test
          git diff -- lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

  quality:
    name: quality
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

  linux-build:
    name: linux-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev desktop-file-utils appstream

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release bundle
        run: flutter build linux --release --no-pub

      - name: Download verified appimagetool
        run: |
          curl --fail --location --output build/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  build/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod 0755 build/appimagetool-x86_64.AppImage
          curl --fail --location --output build/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  build/runtime-x86_64" | sha256sum --check --strict

      - name: Package and validate Linux distributions
        run: tool/package_linux.sh build/appimagetool-x86_64.AppImage build/runtime-x86_64

      - name: Upload Linux distribution candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daymark-linux-x64
          path: |
            build/distributables/*.deb
            build/distributables/*.AppImage
          if-no-files-found: error

  android-build:
    name: android-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Android launcher icons
        run: dart run icons_launcher:create

      - name: Reject stale Android launcher icons
        run: git diff --exit-code -- android/app/src/main/res/mipmap-*

      - name: Build Android debug APK
        run: flutter build apk --debug

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low

  merge-gate:
    name: merge-gate
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - quality
      - linux-build
      - android-build
      - dependency-review
    runs-on: ubuntu-24.04
    steps:
      - name: Require all merge checks
        env:
          QUALITY: ${{ needs.quality.result }}
          LINUX_BUILD: ${{ needs.linux-build.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          test "$QUALITY" = success
          test "$LINUX_BUILD" = success
          test "$ANDROID_BUILD" = success
          test "$DEPENDENCY_REVIEW" = success
