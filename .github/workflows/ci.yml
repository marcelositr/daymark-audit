name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply final interaction polish
        run: |
          cat tool/polish_round.b64.* | tr -d '\n' | base64 -d > /tmp/apply_polish_round.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply_polish_round.py')
          text = path.read_text()

          # The transported payload has one corrupted triple-quote in the
          # app-shell block. Remove that whole block and apply it directly
          # after the rest of the payload succeeds.
          start_marker = '# More menu: method structure first, then data, then app settings.'
          end_marker = '# Localization parity and concise context-aware microcopy.'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('app shell payload boundaries not found')
          text = text[:start] + '# More menu applied directly by CI.\n\n' + text[end:]

          # The access screen contains two `_errorMessage` fields. Anchor the
          # state insertion to the confirmation controller so only the main
          # access state is changed.
          old = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  String? _errorMessage;
          """,
              """  String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''
          new = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
          """,
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('journal access polish marker not found')

          path.write_text(text)
          PY
          python3 -m py_compile /tmp/apply_polish_round.py
          python3 /tmp/apply_polish_round.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/app_shell.dart')
          text = path.read_text()
          old = '''              ListTile(
                leading: const Icon(Icons.search),
                title: Text(l10n.search),
                onTap: () => Navigator.of(sheetContext).pop(4),
              ),
              ListTile(
                leading: const Icon(Icons.format_list_numbered),
                title: Text(l10n.index),
                onTap: () => Navigator.of(sheetContext).pop(5),
              ),
              ListTile(
                leading: const Icon(Icons.backup_outlined),
                title: Text(l10n.backup),
                onTap: () => Navigator.of(sheetContext).pop(_backupAction),
              ),
              ListTile(
                leading: const Icon(Icons.file_download_outlined),
                title: Text(l10n.openExport),
                onTap: () => Navigator.of(sheetContext).pop(_exportAction),
              ),
              ListTile(
                leading: const Icon(Icons.palette_outlined),
                title: Text(l10n.appearance),
                onTap: () => Navigator.of(sheetContext).pop(_appearanceAction),
              ),
'''
          new = '''              ListTile(
                leading: const Icon(Icons.format_list_numbered),
                title: Text(l10n.index),
                onTap: () => Navigator.of(sheetContext).pop(5),
              ),
              ListTile(
                leading: const Icon(Icons.search),
                title: Text(l10n.search),
                onTap: () => Navigator.of(sheetContext).pop(4),
              ),
              const Divider(height: 1),
              ListTile(
                leading: const Icon(Icons.backup_outlined),
                title: Text(l10n.backup),
                onTap: () => Navigator.of(sheetContext).pop(_backupAction),
              ),
              ListTile(
                leading: const Icon(Icons.file_download_outlined),
                title: Text(l10n.openExport),
                onTap: () => Navigator.of(sheetContext).pop(_exportAction),
              ),
              const Divider(height: 1),
              ListTile(
                leading: const Icon(Icons.palette_outlined),
                title: Text(l10n.appearance),
                onTap: () => Navigator.of(sheetContext).pop(_appearanceAction),
              ),
'''
          if new in text:
              print('App shell polish already present.')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
              print('App shell polish applied directly.')
          else:
              raise SystemExit(f'app shell direct replacement count: {text.count(old)}')
          PY

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format sources
        run: dart format lib test

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

      - name: Commit polish round
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs lib test
          if git diff --cached --quiet; then
            echo 'No polish changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ux): polish deliberate journal interactions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
