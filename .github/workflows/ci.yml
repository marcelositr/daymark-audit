name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply final interaction polish
        run: |
          cat tool/polish_round.b64.* | tr -d '\n' | base64 -d > /tmp/apply_polish_round.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply_polish_round.py')
          text = path.read_text()

          # The transported payload has one corrupted triple-quote in the
          # app-shell block. Remove that whole block and apply it directly
          # after the rest of the payload succeeds.
          start_marker = '# More menu: method structure first, then data, then app settings.'
          end_marker = '# Localization parity and concise context-aware microcopy.'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('app shell payload boundaries not found')
          text = text[:start] + '# More menu applied directly by CI.\n\n' + text[end:]

          # The access screen contains two `_errorMessage` fields. Anchor the
          # state insertion to the confirmation controller so only the main
          # access state is changed.
          old = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  String? _errorMessage;
          """,
              """  String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''
          new = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
          """,
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('journal access polish marker not found')

          path.write_text(text)
          PY
          python3 -m py_compile /tmp/apply_polish_round.py
          python3 /tmp/apply_polish_round.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/app_shell.dart')
          text = path.read_text()
          old = '''              ListTile(
                leading: const Icon(Icons.search),
                title: Text(l10n.search),
                onTap: () => Navigator.of(sheetContext).pop(4),
              ),
              ListTile(
                leading: const Icon(Icons.format_list_numbered),
                title: Text(l10n.index),
                onTap: () => Navigator.of(sheetContext).pop(5),
              ),
              ListTile(
                leading: const Icon(Icons.backup_outlined),
                title: Text(l10n.backup),
                onTap: () => Navigator.of(sheetContext).pop(_backupAction),
              ),
              ListTile(
                leading: const Icon(Icons.file_download_outlined),
                title: Text(l10n.openExport),
                onTap: () => Navigator.of(sheetContext).pop(_exportAction),
              ),
              ListTile(
                leading: const Icon(Icons.palette_outlined),
                title: Text(l10n.appearance),
                onTap: () => Navigator.of(sheetContext).pop(_appearanceAction),
              ),
'''
          new = '''              ListTile(
                leading: const Icon(Icons.format_list_numbered),
                title: Text(l10n.index),
                onTap: () => Navigator.of(sheetContext).pop(5),
              ),
              ListTile(
                leading: const Icon(Icons.search),
                title: Text(l10n.search),
                onTap: () => Navigator.of(sheetContext).pop(4),
              ),
              const Divider(height: 1),
              ListTile(
                leading: const Icon(Icons.backup_outlined),
                title: Text(l10n.backup),
                onTap: () => Navigator.of(sheetContext).pop(_backupAction),
              ),
              ListTile(
                leading: const Icon(Icons.file_download_outlined),
                title: Text(l10n.openExport),
                onTap: () => Navigator.of(sheetContext).pop(_exportAction),
              ),
              const Divider(height: 1),
              ListTile(
                leading: const Icon(Icons.palette_outlined),
                title: Text(l10n.appearance),
                onTap: () => Navigator.of(sheetContext).pop(_appearanceAction),
              ),
'''
          if new in text:
              print('App shell polish already present.')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
              print('App shell polish applied directly.')
          else:
              raise SystemExit(f'app shell direct replacement count: {text.count(old)}')
          PY

      - name: Repair polish integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one repair marker, found {count}: {old[:80]!r}'
                  )
              path.write_text(text.replace(old, new, 1))

          # Riverpod 3 in this pinned Flutter toolchain does not expose
          # AsyncValue.valueOrNull. Keep the fixed signifier lane while using
          # a supported non-throwing read.
          path = Path('lib/features/journal/presentation/entry_signifiers.dart')
          text = path.read_text()
          if '.valueOrNull' in text:
              text = text.replace(
                  '.valueOrNull',
                  '.whenOrNull(data: (value) => value)',
              )
          path.write_text(text)

          # Typo introduced in the transported visibility-toggle patch.
          path = Path('lib/features/journal/presentation/open_export_dialog.dart')
          text = path.read_text().replace('hidePasssword', 'hidePassword')
          path.write_text(text)

          # Keep the selected signifier set mutable, but the field reference
          # itself final. Also normalize import groups for directives_ordering.
          path = Path('lib/features/journal/presentation/search_screen.dart')
          text = path.read_text()
          text = text.replace(
              '  Set<JournalSignifier> _selectedSignifiers =',
              '  final Set<JournalSignifier> _selectedSignifiers =',
          )
          lines = text.splitlines()
          end = 0
          while end < len(lines) and (lines[end].startswith('import ') or not lines[end].strip()):
              end += 1
          imports = [line for line in lines[:end] if line.startswith('import ')]
          dart_imports = sorted(line for line in imports if "'dart:" in line)
          package_imports = sorted(line for line in imports if "'package:" in line)
          relative_imports = sorted(
              line
              for line in imports
              if "'dart:" not in line and "'package:" not in line
          )
          groups = [group for group in (dart_imports, package_imports, relative_imports) if group]
          import_block = []
          for index, group in enumerate(groups):
              if index:
                  import_block.append('')
              import_block.extend(group)
          path.write_text('\n'.join(import_block + [''] + lines[end:]) + '\n')

          # UI fakes must follow the new Collections data-source contract.
          replace_required(
              'test/journal/collections_activation_test.dart',
              "  @override\n  Future<String> create({required String title}) async => 'project';\n",
              "  @override\n  Future<String> create({required String title}) async => 'project';\n\n"
              "  @override\n  Future<void> undoCreate(String collectionId) async {}\n",
          )

          replace_required(
              'test/journal/collections_screen_test.dart',
              "    return id;\n  }\n\n  @override\n  Future<CollectionSnapshot> load(String collectionId) async {\n",
              "    return id;\n  }\n\n"
              "  @override\n  Future<void> undoCreate(String collectionId) async {\n"
              "    _collections.removeWhere((item) => item.id == collectionId);\n"
              "    _entries.remove(collectionId);\n"
              "    _references.remove(collectionId);\n"
              "  }\n\n"
              "  @override\n  Future<CollectionSnapshot> load(String collectionId) async {\n",
          )

          # Search fakes keep their behavior while accepting the optional
          # signifier filter introduced by the data-source contract.
          for path_name in (
              'test/journal/search_activation_test.dart',
              'test/journal/search_screen_test.dart',
          ):
              path = Path(path_name)
              text = path.read_text()
              text = re.sub(
                  r'Future<List<JournalSearchResult>> search\(String query\) async \{',
                  'Future<List<JournalSearchResult>> search(\n'
                  '    String query, {\n'
                  '    Set<JournalSignifier> signifiers = const <JournalSignifier>{},\n'
                  '  }) async {',
                  text,
              )
              text = re.sub(
                  r'Future<List<JournalSearchResult>> search\(String query\) \{',
                  'Future<List<JournalSearchResult>> search(\n'
                  '    String query, {\n'
                  '    Set<JournalSignifier> signifiers = const <JournalSignifier>{},\n'
                  '  }) {',
                  text,
              )
              path.write_text(text)

          print('Known analyzer integration issues repaired.')
          PY

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format sources
        run: dart format lib test

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

      - name: Commit polish round
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs lib test
          if git diff --cached --quiet; then
            echo 'No polish changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ux): polish deliberate journal interactions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
