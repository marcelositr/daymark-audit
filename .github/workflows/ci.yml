name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply final interaction polish
        run: |
          cat tool/polish_round.b64.* | tr -d '\n' | base64 -d > /tmp/apply_polish_round.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply_polish_round.py')
          lines = path.read_text().splitlines()

          start = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if '"lib/presentation/app_shell.dart"' in line
              ),
              None,
          )
          end = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if index > (start or 0)
                  and line.startswith('# Localization parity')
              ),
              None,
          )

          if start is None or end is None:
              raise SystemExit('app shell polish block not found')

          quote_lines = [
              index
              for index in range(start, end)
              if '"""' in lines[index]
          ]

          if len(quote_lines) == 3:
              lines.insert(quote_lines[1], '    """,')
          elif len(quote_lines) != 4:
              raise SystemExit(
                  f'unexpected app shell triple-quote count: {len(quote_lines)}'
              )

          text = '\n'.join(lines) + '\n'

          old = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  String? _errorMessage;
          """,
              """  String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''
          new = '''replace_once(
              "lib/features/journal/presentation/journal_access_screen.dart",
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
          """,
              """  final TextEditingController _confirmationController = TextEditingController();

            String? _errorMessage;
            bool _passwordVisible = false;
            bool _confirmationVisible = false;
          """,
          )'''

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('journal access polish marker not found')

          path.write_text(text)
          PY
          python3 -m py_compile /tmp/apply_polish_round.py
          python3 /tmp/apply_polish_round.py

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format sources
        run: dart format lib test

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

      - name: Commit polish round
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs lib test
          if git diff --cached --quiet; then
            echo 'No polish changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ux): polish deliberate journal interactions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
