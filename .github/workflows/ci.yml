name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply fidelity round
        run: |
          python3 tool/apply_bujo_fidelity_core.py
          python3 tool/apply_bujo_fidelity_ui.py
          python3 tool/apply_bujo_fidelity_tests.py
          python3 tool/apply_bujo_fidelity_integration.py

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format sources
        run: dart format lib test

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

      - name: Commit fidelity round
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs lib test
          git commit -m 'feat(journal): close Bullet Journal fidelity gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
