name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply month-cycle experiment
        run: python3 tool/apply_bujo_month_cycle_experiment.py

      - name: Apply integration details
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected integration block not found in {path}')
              file.write_text(text.replace(old, new, 1))

          session = Path('lib/core/session/journal_session.dart')
          text = session.read_text()
          if "import 'package:drift/drift.dart';" not in text:
              text = text.replace(
                  "import 'package:uuid/uuid.dart';",
                  "import 'package:drift/drift.dart';\nimport 'package:uuid/uuid.dart';",
                  1,
              )
          session.write_text(text)

          history = Path('lib/features/journal/presentation/future_history_screen.dart')
          text = history.read_text()
          if not text.startswith("import 'dart:async';"):
              text = "import 'dart:async';\n\n" + text
          text = text.replace("import 'package:flutter/foundation.dart';\n", "", 1)
          text = text.replace(
              "                      _applyArrivalAction(entry, action);",
              "                      unawaited(_applyArrivalAction(entry, action));",
              1,
          )
          history.write_text(text)

          replace_once(
              'lib/features/journal/presentation/today_screen.dart',
              """        case TaskMigrationDestination.collection:
          migrationCollectionId = await showTaskCollectionMigrationDialog(
""",
              """        case TaskMigrationDestination.nextMonth:
          return;
        case TaskMigrationDestination.collection:
          migrationCollectionId = await showTaskCollectionMigrationDialog(
""",
          )

          for path in (
              'test/journal/entry_collection_reference_screen_test.dart',
              'test/journal/future_screen_test.dart',
          ):
              replace_once(
                  path,
                  """  @override
  Future<void> capture({
""",
                  """  @override
  Future<FutureLogSnapshot?> find(String periodStart) async => null;

  @override
  Future<void> capture({
""",
              )

          replace_once(
              'test/journal/future_history_screen_test.dart',
              """  @override
  Future<FutureLogSnapshot?> find(String periodStart) async {
""",
              """  @override
  Future<void> completeTask({required String entryId}) async {}

  @override
  Future<void> discardTask({required String entryId}) async {}

  @override
  Future<FutureLogSnapshot?> find(String periodStart) async {
""",
          )
          PY

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/core/session/journal_session.dart \
            lib/features/journal/presentation/task_migration_dialog.dart \
            lib/features/journal/presentation/monthly_screen.dart \
            lib/features/journal/presentation/future_screen.dart \
            lib/features/journal/presentation/future_history_screen.dart \
            lib/features/journal/presentation/today_screen.dart \
            test/session/daily_task_migration_session_test.dart \
            test/journal/entry_collection_reference_screen_test.dart \
            test/journal/future_screen_test.dart \
            test/journal/future_history_screen_test.dart

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Analyze
        run: flutter analyze

      - name: Run focused experiment tests
        run: flutter test test/session/daily_task_migration_session_test.dart test/journal/rapid_log_input_test.dart test/journal/future_screen_test.dart test/journal/future_history_screen_test.dart

      - name: Commit experiment update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/DAILY_TASK_MIGRATION_EXPERIMENT.md \
            lib/core/session/journal_session.dart \
            lib/features/journal/presentation/task_migration_dialog.dart \
            lib/features/journal/presentation/monthly_screen.dart \
            lib/features/journal/presentation/future_screen.dart \
            lib/features/journal/presentation/future_history_screen.dart \
            lib/features/journal/presentation/today_screen.dart \
            lib/l10n/app_en.arb \
            lib/l10n/app_es.arb \
            lib/l10n/app_pt.arb \
            lib/l10n/app_pt_BR.arb \
            test/session/daily_task_migration_session_test.dart \
            test/journal/entry_collection_reference_screen_test.dart \
            test/journal/future_screen_test.dart \
            test/journal/future_history_screen_test.dart
          git commit -m 'feat(journal): complete Bullet Journal month cycle'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
