name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply Bullet Journal experiment update
        shell: bash
        run: |
          git fetch origin feat/daily-task-migration
          git checkout -B feat/daily-task-migration origin/feat/daily-task-migration

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"expected source block not found in {path}")

          rapid_log = """import 'package:daymark/features/journal/domain/journal_domain.dart';

final class RapidLogInput {
  const RapidLogInput({required this.type, required this.content});

  final JournalEntryType type;
  final String content;
}

RapidLogInput parseRapidLogInput(
  String raw, {
  required JournalEntryType fallbackType,
}) {
  final String input = raw.trim();
  if (input.isEmpty) {
    return RapidLogInput(type: fallbackType, content: '');
  }

  final ({String marker, JournalEntryType type})? signifier = switch (input) {
    String value when value == '•' || value.startsWith('• ') => (
      marker: '•',
      type: JournalEntryType.task,
    ),
    String value when value == '○' || value.startsWith('○ ') => (
      marker: '○',
      type: JournalEntryType.event,
    ),
    String value when value == '–' || value.startsWith('– ') => (
      marker: '–',
      type: JournalEntryType.note,
    ),
    String value when value == '-' || value.startsWith('- ') => (
      marker: '-',
      type: JournalEntryType.note,
    ),
    _ => null,
  };

  if (signifier == null) {
    return RapidLogInput(type: fallbackType, content: input);
  }

  return RapidLogInput(
    type: signifier.type,
    content: input.substring(signifier.marker.length).trimLeft(),
  );
}
"""
          Path('lib/features/journal/presentation/rapid_log_input.dart').write_text(rapid_log)

