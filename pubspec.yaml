name: daymark
description: A minimal, local-first Bullet Journal app for Linux and Android.
publish_to: "none"
version: 1.0.0-beta.2+5

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: 2.9.0
  drift: 2.34.3
  file_picker: 12.2.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  intl: 0.20.3
  path_provider: 2.1.6
  sqlite3: 3.5.2
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.1.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/daymark-icon.png

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
